name: Deploy API

on:
  push:
    branches: [etu]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déployer sur le serveur
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/todo-api
            git fetch origin
            git checkout etu
            git reset --hard origin/etu
            npm ci
            npm run build
            pm2 restart todo-api
            pm2 save
